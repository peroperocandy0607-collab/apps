<script>
// ---- step titles & bubbles (timings follow the reference video)
const STEPS=[
 {i:11.25,o:18.15,b:'STEP 1',c:'#4fd1a5',t:'お客様のお悩みを選ぶだけ'},
 {i:18.2,o:24.2,b:'STEP 2',c:'#f27aa0',t:'お試し → 基本 → 充実の組み合わせに'},
 {i:24.25,o:29.65,b:'STEP 3',c:'#f2c94c',t:'あなたらしさをひとこと'},
 {i:29.7,o:35.6,b:'STEP 4',c:'#9b7cff',t:'ChatGPTへの依頼文が完成！'},
 {i:35.65,o:41.8,b:'ほかにも！',c:'#5ab4f0',t:'メモから商品ページの文章も'},
 {i:41.85,o:47.45,b:'ほかにも！',c:'#f59e5b',t:'サムネイル用のプロンプトも'}];
const BUBS=[[11.6,14.75,'悩みは<br>クリックで選ぶだけ。'],[14.8,18.15,'得意な占術も<br>ここで選べる。'],[18.5,20.95,'まず、<br>いくつ作るか決めて'],[21.0,24.2,'価格も<br>サッと調整。'],[24.6,29.65,'例文ボタンで<br>すぐ入る。'],[30.0,31.95,'ボタンを<br>押して——'],[32.0,35.6,'コピーしてChatGPTへ。<br>それだけ。'],[36.0,41.8,'メモから<br>タイトルも本文も。'],[42.2,47.45,'色とテイストを<br>選ぶだけ。']];
const T=document.getElementById('titles'),B=document.getElementById('bubs');
STEPS.forEach(s=>{T.insertAdjacentHTML('beforeend',`<div class="el badge" style="left:40px;top:96px" data-in="${s.i}" data-out="${s.o}" data-a="left"><i style="background:${s.c};color:${s.c}"></i>${s.b}</div><div class="el ttl" style="left:${s.b.length>6?222:212}px;top:94px" data-in="${s.i+0.15}" data-out="${s.o}" data-a="wipe">${s.t}</div>`);});
BUBS.forEach(b=>{B.insertAdjacentHTML('beforeend',`<div class="el bub" style="left:1052px;top:330px;width:218px;white-space:normal;font-size:17px;padding:11px 10px" data-in="${b[0]}" data-out="${b[1]}" data-a="pop">${b[2]}</div>`);});

const EL=[...document.querySelectorAll('.el')].map(e=>({e,i:+e.dataset.in,o:+e.dataset.out,a:e.dataset.a}));
const clamp=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*2.094)+1;
// camera shakes [start,dur,amp]
const SH=[[2.55,.35,10],[2.85,.15,5],[3.3,.15,5],[3.5,.15,5],[3.75,.2,6],[7.3,.45,14],[7.6,.3,8],[11.1,.2,4],[32.0,.4,10],[47.95,.3,8],[48.45,.15,6],[48.85,.15,6],[49.2,.15,6],[49.5,.2,7],[53.2,.25,6]];
// sparkles
const SPK=[];const sp=document.getElementById('sparks');const R=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(11);
for(let k=0;k<24;k++){const d=document.createElementNS('http://www.w3.org/2000/svg','svg');d.setAttribute('viewBox','0 0 20 20');d.setAttribute('class','sp');d.innerHTML='<path d="M10 0 L11.6 8.4 L20 10 L11.6 11.6 L10 20 L8.4 11.6 L0 10 L8.4 8.4Z" fill="'+(k%3?'#d4b062':'#1b2340')+'"/>';d.style.left=(R()*1250)+'px';d.style.top=(R()*700)+'px';sp.appendChild(d);SPK.push({d,s:.35+R()*.7,ph:R()*6.3,v:.7+R()*1.5});}
// speed lines
const SV=document.getElementById('speed');let sl='';for(let k=0;k<64;k++){const a=k/64*Math.PI*2+(R()-.5)*.05,r1=210+R()*90,r2=900;sl+=`<line x1="${860+Math.cos(a)*r1}" y1="${300+Math.sin(a)*r1*0.8}" x2="${860+Math.cos(a)*r2}" y2="${300+Math.sin(a)*r2}" stroke="#1b2340" stroke-width="${1+R()*4}" opacity="${.25+R()*.35}"/>`;}SV.innerHTML=sl;
// wipes
const W=document.getElementById('wipe');const WC=['#1b2340','#9b7cff','#f27aa0','#f2c94c','#4fd1a5','#5ab4f0','#1b2340'];
WC.forEach((c,k)=>W.insertAdjacentHTML('beforeend',`<div class="wb" style="position:absolute;left:-200px;top:${k*112-40}px;width:1700px;height:118px;background:${c};transform-origin:left"></div>`));
const WB=[...W.children];
function wipeAt(t,t0){const p=(t-t0)/0.6;if(p<0||p>1)return false;WB.forEach((b,k)=>{const d=k*0.05;const q=clamp((p-d)/0.55);const inx=eio(clamp(q*2)),outx=eio(clamp(q*2-1));b.style.transform=`skewX(-20deg) translateX(${-1700+1700*inx+1900*outx}px)`;});return true;}

let fixed=false;function render(t){
  {document.querySelectorAll('#titles .badge').forEach(b=>{const tt=b.nextElementSibling;tt.style.left=(40+b.offsetWidth+18)+'px';});fixed=true;}
  for(const x of EL){
    const d=x.a==='slam'||x.a==='stamp'?0.28:x.a==='spring'?0.7:0.4;
    const pin=clamp((t-x.i)/d),pout=clamp((t-(x.o-0.3))/0.3);let a=eo(pin),op=a*(1-pout),tr='';
    switch(x.a){
      case 'up':tr=`translateY(${(1-a)*40-pout*20}px)`;break;
      case 'drop':tr=`translateY(${(1-a)*-30}px)`;break;
      case 'left':tr=`translateX(${(1-a)*-120-pout*60}px)`;break;
      case 'right':tr=`translateX(${(1-a)*120}px)`;break;
      case 'pop':tr=`scale(${pin<1?0.3+0.7*back(pin):1})`;op=clamp(pin*3)*(1-pout);break;
      case 'slam':tr=`scale(${2.2-1.2*eo(pin)})`;op=clamp(pin*2.5)*(1-pout);break;
      case 'stamp':tr=`scale(${pin<1?1.9-0.9*back(pin)*1:1}) rotate(${(1-eo(pin))*-6}deg)`;op=clamp(pin*3)*(1-pout);break;
      case 'spring':tr=`translateY(${(1-elastic(pin))*160}px)`;op=clamp(pin*4)*(1-pout);break;
      case 'fly':{const r=getComputedStyle(x.e).getPropertyValue('--r')||'0deg';tr=`translate(${(1-a)*260}px,${(1-a)*-80}px) rotate(calc(${r} * ${0.2+0.8*a} + ${(1-a)*30}deg)) scale(${1.15-0.15*a})`;break;}
      case 'wipe':x.e.style.clipPath=`inset(0 ${100-100*eo(pin)}% 0 0)`;op=1*(1-pout)*(pin>0?1:0);tr=`translateX(${(1-a)*-14}px)`;break;
      case 'zoomin':tr=`scale(${0.9+0.1*a})`;break;
      case 'spin':tr=`rotate(${(1-a)*-180}deg) scale(${0.4+0.6*back(clamp(pin))})`;op=clamp(pin*3)*(1-pout);break;
      case 'drip':tr=`translateY(${clamp((t-x.i)/2)*30}px)`;break;
      default:break;}
    x.e.style.opacity=op;x.e.style.transform=tr;
  }
  // Sol reactions
  const A=document.getElementById('solA');
  let ra=0,ry=0,rs=1;
  if(t>0.9&&t<2.5)ra=-5+Math.sin(t*5)*1.5;                         // 首をかしげる
  if(t>=2.5&&t<4.7){const j=clamp((t-2.5)/0.35);ry=-Math.sin(j*Math.PI)*55;ra=Math.sin(t*28)*3*clamp((4.0-t)*2);} // 驚いてジャンプ＋震え
  if(t>=3.95&&t<4.7)rs=1+0.12*eo(clamp((t-3.95)/0.2));               // ズームでパンチ
  if(t>=4.7)ra=-7+Math.sin(t*2)*1;                                     // うなだれる
  A.style.transform+=` translateY(${ry}px) rotate(${ra}deg) scale(${rs})`;A.style.transformOrigin='50% 90%';
  ['q1','q2','q3'].forEach((id,k)=>{const q=document.getElementById(id);q.style.transform+=` translateY(${Math.sin(t*4+k*2)*6}px) rotate(${Math.sin(t*3+k)*12}deg)`;});
  const caret=document.getElementById('caret');caret.style.opacity=(Math.floor(t*2.5)%2)?0:1;
  document.querySelectorAll('.cap').forEach(c=>{const i=+c.dataset.in;c.style.setProperty('--u',eo(clamp((t-i-0.25)/0.4)));});
  const B2=document.getElementById('solB');B2.style.transform+=` translateY(${Math.sin(t*2.4)*5}px)`;
  const C=document.getElementById('solC');let cy=Math.sin(t*2.2)*4,cs=1;
  for(const s of STEPS){const j=clamp((t-s.i)/0.35);if(j>0&&j<1)cy-=Math.sin(j*Math.PI)*30;}
  if(t>=32&&t<32.6){const j=clamp((t-32)/0.6);cy-=Math.sin(j*Math.PI)*45;cs=1+0.15*Math.sin(j*Math.PI);}
  C.style.transform+=` translateY(${cy}px) scale(${cs})`;C.style.transformOrigin='50% 100%';
  const D=document.getElementById('solD');D.style.transform+=` translateY(${Math.sin(t*2.6)*5}px)`;
  const E=document.getElementById('solE');E.style.transform+=` translateY(${Math.sin(t*2)*5}px)`;
  // shine sweep on titles
  [['ttl1',8.2],['ttl2',53.6]].forEach(([id,t0])=>{const p=clamp((t-t0)/1.1);document.getElementById(id).style.backgroundPosition=`${100-100*p}% 0`;});
  // speed lines
  document.getElementById('speed').style.opacity=clamp((t-7.25)/0.1)*(1-clamp((t-7.9)/0.6))*0.9;
  // panel video (ref frames 11.0s → 24fps)
  if(t>=11&&t<47.6){const f=Math.min(880,Math.max(1,Math.floor((t-11)*24)+1));const s='pf/p'+String(f).padStart(4,'0')+'.jpg';const im=document.getElementById('pimg');if(!im.src.endsWith(s))im.src=s;}
  // sparkles
  const boost=(t>7.25&&t<11)||(t>31.9&&t<33.5)||t>52.5?1:0.45;
  SPK.forEach(s=>{const v=(Math.sin(t*s.v*2.2+s.ph)+1)/2;s.d.style.opacity=v*boost;s.d.style.transform=`scale(${s.s*(0.5+0.6*v)}) rotate(${t*30*s.v}deg)`;});
  // wipes
  const w1=wipeAt(t,6.72),w2=wipeAt(t,47.42);W.style.display=(w1||w2)?'block':'none';
  // flashes
  const fl=Math.max(clamp(1-(t-7.28)/0.25)*(t>=7.28?1:0),clamp(1-(t-32.0)/0.3)*(t>=32?0.7:0));document.getElementById('flash').style.opacity=fl;
  // camera shake
  let sx=0,sy=0;for(const[s0,du,am]of SH){if(t>=s0&&t<s0+du){const k=1-(t-s0)/du;sx+=Math.sin(t*90+s0)*am*k;sy+=Math.cos(t*77+s0*3)*am*k;}}
  document.getElementById('cam').style.transform=`translate(${sx}px,${sy}px)`;
  document.getElementById('grid').style.transform=`translate(${(t*6)%32}px,${(t*3)%32}px)`;
  // fades
  document.getElementById('fade').style.opacity=Math.max(clamp(1-t/0.25),clamp((t-56.2)/0.5),clamp(1-Math.abs(t-11.0)/0.12)*0.0);
}
window.render=render;render(0);
</script></body></html>
